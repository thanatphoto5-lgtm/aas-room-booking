<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เข้าสู่ระบบเจ้าหน้าที่ · AAS CMU</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script><script src="login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <img class="login-logo" src="assets/aas-cmu-logo.png" alt="AAS CMU ภาควิชาสัตวศาสตร์และสัตว์น้ำ">
    <div class="card login-card">
      <div class="eyebrow">STAFF · AAS CMU</div>
      <h1>เข้าสู่ระบบเจ้าหน้าที่</h1>
      <p class="muted">กรอกรหัสผ่านเจ้าหน้าที่เพื่อจัดการคำขอและตารางห้อง</p>
      <form id="loginForm">
        <label>รหัสผ่านเจ้าหน้าที่<input name="password" type="password" autocomplete="current-password" required autofocus></label>
        <button class="primary full" id="loginSubmit">เข้าสู่ระบบ</button>
      </form>
      <p id="loginMessage" role="status"></p>
      <a class="secondary full" href="/borrower.html">กลับหน้าจองห้อง</a>
      <p class="small muted">หากลืมรหัสผ่าน กรุณาติดต่อผู้ดูแลระบบของภาควิชาฯ</p>
    </div>
  </main>
</body>
</html>
